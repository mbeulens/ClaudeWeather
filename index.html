<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Europe Weather</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Map of Europe with live weather"></div>

    <header id="title-card">
      <h1>Europe Weather</h1>
      <p id="status">Loading…</p>
    </header>

    <div id="legend" aria-hidden="true">
      <span class="legend-label">Temperature</span>
      <div class="legend-scale">
        <span>-10°</span>
        <div class="legend-gradient"></div>
        <span>35°</span>
      </div>
    </div>

    <div id="forecast-slider" role="group" aria-label="Forecast day selector">
      <div class="forecast-day-label">
        <span id="day-name">Today</span>
        <span id="day-date"></span>
      </div>
      <input
        type="range"
        id="day-slider"
        min="0"
        max="7"
        value="0"
        step="1"
        aria-label="Days from today"
      />
      <div class="forecast-ticks" aria-hidden="true">
        <span>Today</span>
        <span>+1</span>
        <span>+2</span>
        <span>+3</span>
        <span>+4</span>
        <span>+5</span>
        <span>+6</span>
        <span>+7</span>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
